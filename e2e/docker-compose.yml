name: autowp-e2e

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40

  wp-ssh:
    build:
      context: .
      dockerfile: docker/wp-ssh/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${AUTOWP_PORT_SSH_HTTP:-8080}:80"
      - "${AUTOWP_PORT_SSH:-2222}:22"
    volumes:
      - ssh-html:/var/www/html
      - ./.tmp/id_ed25519.pub:/authorized_keys_src:ro
      - ./.cache/wp-cli:/wpcli-cache
    environment:
      WP_CLI_CACHE_DIR: /wpcli-cache
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s -o /dev/null http://localhost/ && (exec 3<>/dev/tcp/127.0.0.1/22)"]
      interval: 3s
      timeout: 5s
      retries: 40

  wp-locked:
    image: wordpress:php8.2-apache
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${AUTOWP_PORT_LOCKED_HTTP:-8081}:80"
    volumes:
      - locked-html:/var/www/html
      - ./docker/wp-locked/locked.ini:/usr/local/etc/php/conf.d/zz-locked.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost/"]
      interval: 3s
      timeout: 5s
      retries: 40

  # One-off wp-cli for wp-locked (which has no wp-cli/exec of its own): `docker compose run --rm wpcli-locked wp ...`
  wpcli-locked:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - locked-html:/var/www/html

  mock-feeds:
    image: nginx:1.27-alpine
    ports:
      - "${AUTOWP_PORT_FEEDS:-8090}:80"
    volumes:
      - ./fixtures/feeds:/usr/share/nginx/html:ro
      - ./docker/mock-feeds/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/wordfence-v3.json"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  ssh-html:
  locked-html:
